[project]
name = "saudeagenda"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg2 (>=2.9.12,<3.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "pyjwt (>=2.14.0,<3.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poe.tasks]
run = "python main.py"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "poethepoet (>=0.48.0,<0.49.0)"
]
